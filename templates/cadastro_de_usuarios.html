{% extends "base.html" %}

{% block title %}
Cadastrar Usuário
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">Cadastrar Usuário</h2>
            <p class="text-muted mb-0">
                Crie um novo usuário para acessar o sistema.
            </p>
        </div>

        <a href="{{ url_for('gerenciar_usuarios') }}" class="btn btn-outline-secondary">
            Gerenciar usuários
        </a>

    </div>

    <div class="card">
        <div class="card-body p-4">

            <form action="{{ url_for('cadastrar_usuario') }}" method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">
                            Nome do usuário
                        </label>

                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nivel_acesso" class="form-label">
                            Nível de acesso
                        </label>

                        <select id="nivel_acesso"
                                name="nivel_acesso"
                                class="form-select"
                                required>

                            <option value="">Selecione</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Usuário">Usuário</option>

                        </select>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">
                            Senha
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a href="{{ url_for('dashboard') }}" class="btn btn-light">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Cadastrar usuário
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
