{% extends "base.html" %}

{% block title %}
Editar Paciente
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="page-header mb-4">

        <div>
            <h2 class="mb-1">
                <i class="bi bi-person-gear text-primary me-2"></i>
                Editar Paciente
            </h2>

            <p class="text-muted mb-0">
                Atualize os dados cadastrais do paciente.
            </p>
        </div>

        <a href="{{ url_for('consultar_pacientes') }}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-1"></i>
            Voltar para pacientes

        </a>

    </div>

    <div class="card">

        <div class="card-body p-4">

            <form action="{{ url_for('editar_paciente', id=paciente.id) }}"
                  method="post"
                  enctype="multipart/form-data"
                  onsubmit="return validarCPF()">

                <div class="form-section">

                    <div class="section-title">
                        <i class="bi bi-person-vcard text-primary"></i>
                        Dados Pessoais
                    </div>

                    <div class="row g-3">

                        <div class="col-md-8">

                            <label for="nome" class="form-label fw-semibold">
                                Nome
                            </label>

                            <input type="text"
                                   id="nome"
                                   name="nome"
                                   class="form-control"
                                   value="{{ paciente.nome }}"
                                   required>

                        </div>

                        <div class="col-md-4">

                            <label for="idade" class="form-label fw-semibold">
                                Idade
                            </label>

                            <input type="number"
                                   id="idade"
                                   name="idade"
                                   class="form-control"
                                   value="{{ paciente.idade }}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label for="dnacimento" class="form-label fw-semibold">
                                Data de nascimento
                            </label>

                            <input type="text"
                                   id="dnacimento"
                                   name="dnacimento"
                                   class="form-control"
                                   value="{{ paciente.dnacimento }}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label for="cpf" class="form-label fw-semibold">
                                CPF
                            </label>

                            <input type="text"
                                   id="cpf"
                                   name="cpf"
                                   class="form-control"
                                   value="{{ paciente.cpf }}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label for="telefone" class="form-label fw-semibold">
                                Telefone
                            </label>

                            <input type="text"
                                   id="telefone"
                                   name="telefone"
                                   class="form-control"
                                   value="{{ paciente.telefone }}">

                        </div>

                        <div class="col-md-6">

                            <label for="convenio" class="form-label fw-semibold">
                                Convênio
                            </label>

                            <input type="text"
                                   id="convenio"
                                   name="convenio"
                                   class="form-control"
                                   value="{{ paciente.convenio }}">

                        </div>

                        <div class="col-12">

                            <label for="foto" class="form-label fw-semibold">
                                Foto
                            </label>

                            <input type="file"
                                   id="foto"
                                   name="foto"
                                   class="form-control">

                            {% if paciente.foto %}

                                <div class="current-photo mt-3">

                                    <p class="text-muted small mb-2">
                                        Foto atual:
                                    </p>

                                    <img src="{{ url_for('static', filename='uploads/' ~ paciente.foto) }}"
                                         alt="{{ paciente.nome }}"
                                         class="rounded">

                                </div>

                            {% endif %}

                        </div>

                    </div>

                </div>

                <div class="form-section mt-5">

                    <div class="section-title">
                        <i class="bi bi-geo-alt text-primary"></i>
                        Endereço
                    </div>

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label for="rua" class="form-label fw-semibold">
                                Rua
                            </label>

                            <input type="text"
                                   id="rua"
                                   name="rua"
                                   class="form-control"
                                   value="{{ paciente.rua }}"
                                   required>

                        </div>

                        <div class="col-md-2">

                            <label for="numero" class="form-label fw-semibold">
                                Número
                            </label>

                            <input type="text"
                                   id="numero"
                                   name="numero"
                                   class="form-control"
                                   value="{{ paciente.numero }}">

                        </div>

                        <div class="col-md-4">

                            <label for="cidade" class="form-label fw-semibold">
                                Cidade
                            </label>

                            <input type="text"
                                   id="cidade"
                                   name="cidade"
                                   class="form-control"
                                   value="{{ paciente.cidade }}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label for="estado" class="form-label fw-semibold">
                                Estado
                            </label>

                            <input type="text"
                                   id="estado"
                                   name="estado"
                                   class="form-control"
                                   value="{{ paciente.estado }}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label for="pais" class="form-label fw-semibold">
                                País
                            </label>

                            <input type="text"
                                   id="pais"
                                   name="pais"
                                   class="form-control"
                                   value="{{ paciente.pais }}"
                                   required>

                        </div>

                    </div>

                </div>

                <div class="form-actions mt-5">

                    <a href="{{ url_for('consultar_pacientes') }}"
                       class="btn btn-light">

                        <i class="bi bi-x-circle me-1"></i>
                        Cancelar

                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle me-1"></i>
                        Salvar alterações

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
    function validarCPF() {
        const cpf = document.getElementById('cpf').value;
        const regex = /^\d{3}\.\d{3}\.\d{3}-\d{2}$/;

        if (!regex.test(cpf)) {
            alert('Por favor, insira um CPF no formato 000.000.000-00');
            return false;
        }

        return true;
    }

    document.getElementById('cpf').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');

        if (value.length > 11) {
            value = value.slice(0, 11);
        }

        e.target.value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    });

    document.getElementById('dnacimento').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');

        if (value.length > 8) {
            value = value.slice(0, 8);
        }

        e.target.value = value.replace(/(\d{2})(\d{2})(\d{4})/, '$1/$2/$3');
    });

    document.getElementById('telefone').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');

        if (value.length > 11) {
            value = value.slice(0, 11);
        }

        e.target.value = value.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
    });
</script>

{% endblock %}
