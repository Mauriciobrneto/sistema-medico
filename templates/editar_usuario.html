{% extends "base.html" %}

{% block title %}
Editar Usuário
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">Editar Usuário</h2>
            <p class="text-muted mb-0">
                Atualize os dados do usuário selecionado.
            </p>
        </div>

        <a href="{{ url_for('gerenciar_usuarios') }}" class="btn btn-outline-secondary">
            Voltar para usuários
        </a>

    </div>

    <div class="card">
        <div class="card-body p-4">

            <form action="{{ url_for('editar_usuario', id=usuario.idusuarios) }}" method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">
                            Nome do usuário
                        </label>

                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               value="{{ usuario.nome }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nivel_acesso" class="form-label">
                            Nível de acesso
                        </label>

                        <select id="nivel_acesso"
                                name="nivel_acesso"
                                class="form-select"
                                required>

                            <option value="Administrador"
                                {% if usuario.nivel_acesso == 'Administrador' %}selected{% endif %}>
                                Administrador
                            </option>

                            <option value="Usuário"
                                {% if usuario.nivel_acesso == 'Usuário' %}selected{% endif %}>
                                Usuário
                            </option>

                        </select>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">
                            Nova senha
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               placeholder="Digite uma nova senha"
                               required>

                        <small class="text-muted">
                            A senha será criptografada automaticamente.
                        </small>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               value="{{ usuario.email }}"
                               required>
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a href="{{ url_for('gerenciar_usuarios') }}" class="btn btn-light">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
